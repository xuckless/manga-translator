<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" aria-label="A raw manga panel with vertical Japanese in a speech balloon, and the same panel lettered in English. The screentone is untouched and the sound effect stays as drawn art.">
<title>A raw manga panel with vertical Japanese in a speech balloon, and the same panel lettered in English. The screentone is untouched and the sound effect stays as drawn art.</title>
<style>
.sans { font-family: -apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; }
.comic { font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Comic Relief', cursive, sans-serif; font-weight: 700; }
.jp { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', 'Noto Serif CJK JP', serif; font-weight: 600; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }

</style>
<defs>
  <pattern id="tone" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <circle cx="3" cy="3" r="1.25" fill="#1b1a19" opacity=".5"/>
  </pattern>
  <pattern id="tone2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <circle cx="2.5" cy="2.5" r=".9" fill="#1b1a19" opacity=".45"/>
  </pattern>
</defs>
<rect x="0.5" y="0.5" width="479" height="249" rx="10" fill="#fbfaf7" stroke="#d9d4cb"/>
<text class="sans" x="120" y="24" font-size="12" font-weight="700" fill="#8a847b" text-anchor="middle">RAW</text>
<text class="sans" x="360" y="24" font-size="12" font-weight="700" fill="#e8590c" text-anchor="middle">TRANSLATED</text>
<g transform="translate(16 34)">
<rect x="0" y="0" width="208" height="200" fill="url(#tone)"/>
<line x1="208" y1="20" x2="150" y2="40" stroke="#1b1a19" stroke-width="1" opacity=".35"/>
<line x1="208" y1="42" x2="150" y2="56" stroke="#1b1a19" stroke-width="1" opacity=".35"/>
<line x1="208" y1="64" x2="150" y2="72" stroke="#1b1a19" stroke-width="1" opacity=".35"/>
<line x1="208" y1="86" x2="150" y2="88" stroke="#1b1a19" stroke-width="1" opacity=".35"/>
<line x1="208" y1="108" x2="150" y2="104" stroke="#1b1a19" stroke-width="1" opacity=".35"/>
<line x1="208" y1="130" x2="150" y2="120" stroke="#1b1a19" stroke-width="1" opacity=".35"/>
<rect x="10" y="10" width="74" height="26" fill="#fbfaf7" stroke="#1b1a19" stroke-width="1.5"/>
<text class="jp" x="47" y="28" font-size="13" fill="#1b1a19" text-anchor="middle">その頃…</text>
<path d="M87.2 150.4 L54 192 L112.8 159.1" fill="#fff" stroke="#1b1a19" stroke-width="2" stroke-linejoin="round"/><ellipse cx="116" cy="104" rx="64" ry="58" fill="#fff" stroke="#1b1a19" stroke-width="2"/>
<text class="jp" x="138" y="72" font-size="15" fill="#1b1a19" text-anchor="middle">ま</text>
<text class="jp" x="138" y="90" font-size="15" fill="#1b1a19" text-anchor="middle">さ</text>
<text class="jp" x="138" y="108" font-size="15" fill="#1b1a19" text-anchor="middle">か</text>
<text class="jp" x="117" y="72" font-size="15" fill="#1b1a19" text-anchor="middle">本</text>
<text class="jp" x="117" y="90" font-size="15" fill="#1b1a19" text-anchor="middle">当</text>
<text class="jp" x="117" y="108" font-size="15" fill="#1b1a19" text-anchor="middle">に</text>
<text class="jp" x="96" y="72" font-size="15" fill="#1b1a19" text-anchor="middle">来</text>
<text class="jp" x="96" y="90" font-size="15" fill="#1b1a19" text-anchor="middle">る</text>
<text class="jp" x="96" y="108" font-size="15" fill="#1b1a19" text-anchor="middle">と</text>
<text class="jp" x="96" y="126" font-size="15" fill="#1b1a19" text-anchor="middle">は</text>
<text class="jp" x="96" y="144" font-size="15" fill="#1b1a19" text-anchor="middle">︙</text>
<text class="jp" x="190" y="190" font-size="30" font-weight="900" fill="#1b1a19" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" text-anchor="end" transform="rotate(-12 190 190)">ドン</text>
<rect x="0" y="0" width="208" height="200" fill="none" stroke="#1b1a19" stroke-width="2.5"/>
</g>
<g transform="translate(256 34)">
<rect x="0" y="0" width="208" height="200" fill="url(#tone)"/>
<line x1="208" y1="20" x2="150" y2="40" stroke="#1b1a19" stroke-width="1" opacity=".35"/>
<line x1="208" y1="42" x2="150" y2="56" stroke="#1b1a19" stroke-width="1" opacity=".35"/>
<line x1="208" y1="64" x2="150" y2="72" stroke="#1b1a19" stroke-width="1" opacity=".35"/>
<line x1="208" y1="86" x2="150" y2="88" stroke="#1b1a19" stroke-width="1" opacity=".35"/>
<line x1="208" y1="108" x2="150" y2="104" stroke="#1b1a19" stroke-width="1" opacity=".35"/>
<line x1="208" y1="130" x2="150" y2="120" stroke="#1b1a19" stroke-width="1" opacity=".35"/>
<rect x="10" y="10" width="74" height="26" fill="#fbfaf7" stroke="#1b1a19" stroke-width="1.5"/>
<text class="comic" x="47" y="27.5" font-size="12" fill="#1b1a19" text-anchor="middle">Meanwhile…</text>
<path d="M87.2 150.4 L54 192 L112.8 159.1" fill="#fff" stroke="#1b1a19" stroke-width="2" stroke-linejoin="round"/><ellipse cx="116" cy="104" rx="64" ry="58" fill="#fff" stroke="#1b1a19" stroke-width="2"/>
<text class="comic" x="116" y="86.0" font-size="13" fill="#1b1a19" text-anchor="middle">I never</text>
<text class="comic" x="116" y="101.0" font-size="13" fill="#1b1a19" text-anchor="middle">thought he'd</text>
<text class="comic" x="116" y="116.0" font-size="13" fill="#1b1a19" text-anchor="middle">actually</text>
<text class="comic" x="116" y="131.1" font-size="13" fill="#1b1a19" text-anchor="middle">show up…</text>
<text class="jp" x="190" y="190" font-size="30" font-weight="900" fill="#1b1a19" stroke="#fff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" text-anchor="end" transform="rotate(-12 190 190)">ドン</text>
<rect x="0" y="0" width="208" height="200" fill="none" stroke="#1b1a19" stroke-width="2.5"/>
</g>
<path d="M233 134 h12 m-5 -6 l6 6 l-6 6" fill="none" stroke="#e8590c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
