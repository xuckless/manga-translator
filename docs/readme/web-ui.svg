<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-label="The web UI in three steps: pick pages in the file selector (kept in page order), translate with your own API key while a progress bar runs, then read in the built-in reader.">
<title>The web UI in three steps: pick pages in the file selector (kept in page order), translate with your own API key while a progress bar runs, then read in the built-in reader.</title>
<style>
.sans { font-family: -apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; }
.comic { font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Comic Relief', cursive, sans-serif; font-weight: 700; }
.jp { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', 'Noto Serif CJK JP', serif; font-weight: 600; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }

</style>
<defs>
  <pattern id="tone" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <circle cx="3" cy="3" r="1.25" fill="#1b1a19" opacity=".5"/>
  </pattern>
  <pattern id="tone2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <circle cx="2.5" cy="2.5" r=".9" fill="#1b1a19" opacity=".45"/>
  </pattern>
</defs>
<rect x="0.5" y="0.5" width="719" height="229" rx="10" fill="#fbfaf7" stroke="#d9d4cb"/>
<text class="sans" x="16" y="26" font-size="13" font-weight="700" fill="#1b1a19">Pick pages</text>
<g transform="translate(16 38)">
<rect width="216" height="176" rx="8" fill="#fff" stroke="#1b1a19" stroke-width="1.5"/>
<circle cx="18" cy="23" r="8" fill="#e8590c"/><text class="sans" x="18" y="26.5" font-size="9.5" font-weight="800" fill="#fff" text-anchor="middle">1</text><rect x="32" y="14" width="14" height="19" fill="url(#tone2)" stroke="#1b1a19" stroke-width="1"/><text class="mono" x="54" y="27" font-size="11" fill="#1b1a19">page1.jpg</text><text class="sans" x="200" y="27" font-size="11" fill="#8a847b" text-anchor="end">⋮⋮</text>
<circle cx="18" cy="48" r="8" fill="#e8590c"/><text class="sans" x="18" y="51.5" font-size="9.5" font-weight="800" fill="#fff" text-anchor="middle">2</text><rect x="32" y="39" width="14" height="19" fill="url(#tone2)" stroke="#1b1a19" stroke-width="1"/><text class="mono" x="54" y="52" font-size="11" fill="#1b1a19">page2.jpg</text><text class="sans" x="200" y="52" font-size="11" fill="#8a847b" text-anchor="end">⋮⋮</text>
<circle cx="18" cy="73" r="8" fill="#e8590c"/><text class="sans" x="18" y="76.5" font-size="9.5" font-weight="800" fill="#fff" text-anchor="middle">3</text><rect x="32" y="64" width="14" height="19" fill="url(#tone2)" stroke="#1b1a19" stroke-width="1"/><text class="mono" x="54" y="77" font-size="11" fill="#1b1a19">page3.jpg</text><text class="sans" x="200" y="77" font-size="11" fill="#8a847b" text-anchor="end">⋮⋮</text>
<text class="mono" x="48" y="102" font-size="11" fill="#8a847b">…</text>
<circle cx="18" cy="123" r="8" fill="#e8590c"/><text class="sans" x="18" y="126.5" font-size="9.5" font-weight="800" fill="#fff" text-anchor="middle">10</text><rect x="32" y="114" width="14" height="19" fill="url(#tone2)" stroke="#1b1a19" stroke-width="1"/><text class="mono" x="54" y="127" font-size="11" fill="#1b1a19">page10.jpg</text><text class="sans" x="200" y="127" font-size="11" fill="#8a847b" text-anchor="end">⋮⋮</text><rect x="12" y="140" width="112" height="24" rx="6" fill="#e8590c"/><text class="sans" x="68" y="156" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Add &amp; translate</text><text class="sans" x="134" y="156" font-size="10" fill="#8a847b">sorted 1, 2 … 10</text>
</g>
<text class="sans" x="252" y="26" font-size="13" font-weight="700" fill="#1b1a19">Translate with your key</text>
<g transform="translate(252 38)">
<rect width="216" height="176" rx="8" fill="#fff" stroke="#1b1a19" stroke-width="1.5"/>
<text class="sans" x="12" y="22" font-size="10" font-weight="700" fill="#8a847b">ANTHROPIC API KEY</text>
<rect x="12" y="30" width="192" height="24" rx="5" fill="#fff" stroke="#cfc9bf"/>
<text class="mono" x="20" y="46" font-size="11" fill="#1b1a19">sk-ant-••••••••••••</text>
<text class="sans" x="12" y="72" font-size="10" fill="#8a847b">stays in your browser, never on disk</text>
<text class="sans" x="12" y="102" font-size="11.5" font-weight="700" fill="#1b1a19">Translating · page 5 of 12</text>
<rect x="12" y="110" width="192" height="6" rx="3" fill="#efedea"/><rect x="12" y="110" width="80" height="6" rx="3" fill="#e8590c"/>
<text class="mono" x="12" y="136" font-size="9.5" fill="#8a847b">detect page5.jpg: 9 regions</text>
<text class="mono" x="12" y="150" font-size="9.5" fill="#8a847b">page5.jpg: 4120 in / 610 out</text>
<text class="mono" x="12" y="164" font-size="9.5" fill="#8a847b">render page4.jpg: 7 regions</text>
</g>
<text class="sans" x="488" y="26" font-size="13" font-weight="700" fill="#1b1a19">Read</text>
<g transform="translate(488 38)">
<rect width="216" height="176" rx="8" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="1.5"/>
<rect x="58" y="28" width="100" height="124" fill="#fff"/>
<rect x="64" y="34" width="88" height="52" fill="url(#tone2)" stroke="#1b1a19" stroke-width="1.2"/>
<rect x="64" y="90" width="42" height="56" fill="#fff" stroke="#1b1a19" stroke-width="1.2"/>
<rect x="110" y="90" width="42" height="56" fill="url(#tone2)" stroke="#1b1a19" stroke-width="1.2"/>
<ellipse cx="128" cy="56" rx="18" ry="14" fill="#fff" stroke="#1b1a19"/>
<ellipse cx="85" cy="112" rx="15" ry="13" fill="#fff" stroke="#1b1a19"/>
<line x1="115.0" y1="51" x2="133.0" y2="51" stroke="#1b1a19" stroke-width="1.6"/>
<line x1="111.0" y1="56" x2="137.0" y2="56" stroke="#1b1a19" stroke-width="1.6"/>
<line x1="114.0" y1="61" x2="134.0" y2="61" stroke="#1b1a19" stroke-width="1.6"/>
<line x1="80.0" y1="108" x2="90.0" y2="108" stroke="#1b1a19" stroke-width="1.6"/>
<line x1="77.0" y1="113" x2="93.0" y2="113" stroke="#1b1a19" stroke-width="1.6"/>
<line x1="81.0" y1="118" x2="89.0" y2="118" stroke="#1b1a19" stroke-width="1.6"/>
<rect x="88" y="8" width="40" height="14" rx="4" fill="#ffffff22" stroke="#ffffff33"/><text class="sans" x="108.0" y="18.5" font-size="8.5" font-weight="700" fill="#eee" text-anchor="middle">Original</text>
<rect x="132" y="8" width="34" height="14" rx="4" fill="#ffffff22" stroke="#ffffff33"/><text class="sans" x="149.0" y="18.5" font-size="8.5" font-weight="700" fill="#eee" text-anchor="middle">Paged</text>
<rect x="170" y="8" width="40" height="14" rx="4" fill="#ffffff22" stroke="#ffffff33"/><text class="sans" x="190.0" y="18.5" font-size="8.5" font-weight="700" fill="#eee" text-anchor="middle">R → L</text>
<text class="sans" x="12" y="19" font-size="10" font-weight="700" fill="#eee">Ch. 9</text>
<rect x="12" y="160" width="140" height="4" rx="2" fill="#333"/><rect x="104" y="160" width="48" height="4" rx="2" fill="#ff7a33"/>
<text class="sans" x="204" y="166" font-size="10" font-weight="700" fill="#eee" text-anchor="end">4 / 32</text>
</g>
</svg>
