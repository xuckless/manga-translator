<svg xmlns="http://www.w3.org/2000/svg" width="720" height="192" viewBox="0 0 720 192" role="img" aria-label="Four steps: detect the balloons and text, translate the numbered page with Claude, clean the Japanese off, letter the English to the balloon's shape.">
<title>Four steps: detect the balloons and text, translate the numbered page with Claude, clean the Japanese off, letter the English to the balloon's shape.</title>
<style>
.sans { font-family: -apple-system, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif; }
.comic { font-family: 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Comic Relief', cursive, sans-serif; font-weight: 700; }
.jp { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', 'Noto Serif CJK JP', serif; font-weight: 600; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }

</style>
<defs>
  <pattern id="tone" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <circle cx="3" cy="3" r="1.25" fill="#1b1a19" opacity=".5"/>
  </pattern>
  <pattern id="tone2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <circle cx="2.5" cy="2.5" r=".9" fill="#1b1a19" opacity=".45"/>
  </pattern>
</defs>
<rect x="0.5" y="0.5" width="719" height="191" rx="10" fill="#fbfaf7" stroke="#d9d4cb"/>
<text class="sans" x="16" y="26" font-size="13" font-weight="800" fill="#e8590c">1</text>
<text class="sans" x="30" y="26" font-size="13" font-weight="700" fill="#1b1a19">Detect</text>
<g transform="translate(16 38)">
<rect width="160" height="120" fill="url(#tone2)"/>
<path d="M57.5 93.6 L44 114 L77.5 99.9" fill="#fff" stroke="#1b1a19" stroke-width="2" stroke-linejoin="round"/><ellipse cx="80" cy="60" rx="50" ry="42" fill="#fff" stroke="#1b1a19" stroke-width="2"/><text class="jp" x="88" y="46" font-size="14" fill="#1b1a19" text-anchor="middle">え</text>
<text class="jp" x="88" y="62" font-size="14" fill="#1b1a19" text-anchor="middle">っ</text>
<text class="jp" x="69" y="46" font-size="14" fill="#1b1a19" text-anchor="middle">マ</text>
<text class="jp" x="69" y="62" font-size="14" fill="#1b1a19" text-anchor="middle">ジ</text>
<text class="jp" x="69" y="78" font-size="14" fill="#1b1a19" text-anchor="middle">で</text>
<text class="jp" x="69" y="94" font-size="14" fill="#1b1a19" text-anchor="middle">︖</text><rect x="58" y="30" width="42" height="70" fill="none" stroke="#e8590c" stroke-width="2" rx="2"/><circle cx="58" cy="30" r="8" fill="#e8590c"/><text class="sans" x="58" y="34" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<rect width="160" height="120" fill="none" stroke="#1b1a19" stroke-width="2"/>
</g>
<text class="sans" x="16" y="178" font-size="11" fill="#8a847b">balloons and text, ~0.3 s a page</text>
<text class="sans" x="192" y="26" font-size="13" font-weight="800" fill="#e8590c">2</text>
<text class="sans" x="206" y="26" font-size="13" font-weight="700" fill="#1b1a19">Translate</text>
<g transform="translate(192 38)">
<rect width="160" height="120" fill="#fff"/>
<text class="mono" x="10" y="24" font-size="10" fill="#1b1a19">{ "id": "1",</text>
<text class="mono" x="10" y="41" font-size="10" fill="#1b1a19">  "text": "えっ マジで？",</text>
<text class="mono" x="10" y="58" font-size="10" fill="#1b1a19">  "category": "dialogue",</text>
<text class="mono" x="10" y="75" font-size="10" fill="#1b1a19">  "translation":</text>
<text class="mono" x="10" y="92" font-size="10" fill="#e8590c">    "Wait, seriously?" }</text>
<text class="mono" x="10" y="109" font-size="10" fill="#8a847b">+ the story so far</text>
<rect width="160" height="120" fill="none" stroke="#1b1a19" stroke-width="2"/>
</g>
<text class="sans" x="192" y="178" font-size="11" fill="#8a847b">Claude reads the numbered page</text>
<text class="sans" x="368" y="26" font-size="13" font-weight="800" fill="#e8590c">3</text>
<text class="sans" x="382" y="26" font-size="13" font-weight="700" fill="#1b1a19">Clean</text>
