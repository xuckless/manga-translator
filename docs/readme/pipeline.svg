<path d="M57.5 93.6 L44 114 L77.5 99.9" fill="#fff" stroke="#1b1a19" stroke-width="2" stroke-linejoin="round"/><ellipse cx="80" cy="60" rx="50" ry="42" fill="#fff" stroke="#1b1a19" stroke-width="2"/><rect x="58" y="30" width="42" height="70" fill="none" stroke="#8a847b" stroke-width="1" stroke-dasharray="3 3" rx="2"/>
<rect width="160" height="120" fill="none" stroke="#1b1a19" stroke-width="2"/>
</g>
<text class="sans" x="368" y="178" font-size="11" fill="#8a847b">paint the paper, or inpaint art</text>
<text class="sans" x="544" y="26" font-size="13" font-weight="800" fill="#e8590c">4</text>
<text class="sans" x="558" y="26" font-size="13" font-weight="700" fill="#1b1a19">Letter</text>
<g transform="translate(544 38)">
<rect width="160" height="120" fill="url(#tone2)"/>
<path d="M57.5 93.6 L44 114 L77.5 99.9" fill="#fff" stroke="#1b1a19" stroke-width="2" stroke-linejoin="round"/><ellipse cx="80" cy="60" rx="50" ry="42" fill="#fff" stroke="#1b1a19" stroke-width="2"/><text class="comic" x="80" y="57.0" font-size="13" fill="#1b1a19" text-anchor="middle">Wait,</text>
<text class="comic" x="80" y="72.0" font-size="13" fill="#1b1a19" text-anchor="middle">seriously?</text>
